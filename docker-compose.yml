version: "3"
services:
  next:
    container_name: marketing_simulations
    image: node:26.7.0-alpine
    ports:
      - "3000:3000"
    command:
      - sh
      - -c
      - |
        npm install -g corepack
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn install
        yarn next dev -p 3000 --hostname 0.0.0.0
    working_dir: /app
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    tty: true
    stdin_open: true
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://root:root@postgres:5432/app
  postgres:
    image: postgres:18-alpine
    volumes:
      - ./docker/postgres/volume:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=app
    ports:
      - "5432:5432"

volumes:
  node_modules: {}
